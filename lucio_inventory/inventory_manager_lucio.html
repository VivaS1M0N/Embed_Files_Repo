<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control de Bodega - Patio Covers</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.4/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <style>
      .animate-fade-in {
        animation: fadeIn 0.3s ease;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useMemo } = React;

      // --- CONSTANTES Y DATOS DE DURALUM ---
      const COLORS = [
        "Beechwood", "Driftwood", "Maplewood", "Pewter",
        "Sandalwood", "Siennawood", "Slate", "White", "Ebony"
      ];

      const CUT_TYPES = [
        { code: "STK", label: "Stock / Recto" },
        { code: "COE", label: "Corbel 1 Lado" },
        { code: "CBE", label: "Corbel 2 Lados" },
        { code: "MTR", label: "Miter / 45°" },
        { code: "BVL", label: "Bevel / Bisel" },
        { code: "SCP", label: "Scallop" }
      ];

      const DEFAULT_CATEGORIES = {
        "Estructura (Beams/Rafters)": [
          "3x8 Header Beam", "2x6 Rafter", "2x6 Sideplate/Ledger",
          "3x3 Alum Post", "Rollform Gutter", "Steel Beam Insert", "Side Fascia"
        ],
        "Lattice (Sombra)": [
          "2x2 Lattice Tube", "2x3 Lattice Tube", "U-Channel", "Lattice Beam"
        ],
        "Flat Pan (Sólido)": [
          "Flat Pan 8\" Solid", "Flat Pan 6\" Solid", "C-Hanger (Wall)", "Fan Beam"
        ],
        "Postes y Acero": [
          "Steel Post 3x3 (Heavy)", "Steel Post Insert", "Stucco Column 10x10"
        ]
      };

      const BASE_ITEMS_INIT = [
        { id: 'b1', name: 'Wedge Anchors 3/8 x 2-3/4"', category: 'Hardware', minStock: 25, currentStock: 0, unit: 'pzs' },
        { id: 'b2', name: 'Sacos Concreto', category: 'Base', minStock: 10, currentStock: 0, unit: 'sacos' },
        { id: 'b3', name: 'Rebar #4 (1/2")', category: 'Base', minStock: 40, currentStock: 0, unit: 'ft' },
        { id: 'b4', name: 'Sikaflex (White)', category: 'Sealant', minStock: 5, currentStock: 0, unit: 'tubos' },
        { id: 'b5', name: 'Spray Paint (Touch-up)', category: 'Paint', minStock: 2, currentStock: 0, unit: 'botes' },
        { id: 'b6', name: 'End Caps 3x8 Beam', category: 'Duralum Parts', minStock: 10, currentStock: 0, unit: 'pzs' },
        { id: 'b7', name: 'End Caps 2x6 Rafter', category: 'Duralum Parts', minStock: 20, currentStock: 0, unit: 'pzs' },
        { id: 'b8', name: 'Screws SMS #10 x 1/2" (Pntd)', category: 'Hardware', minStock: 1, currentStock: 0, unit: 'caja' },
        { id: 'b9', name: 'LED Wafers', category: 'Utilities', minStock: 4, currentStock: 0, unit: 'pzs' },
      ];

      function PatioInventoryManager() {
        const [activeTab, setActiveTab] = useState('aluminum');
        const [aluminumItems, setAluminumItems] = useState([
          { id: 1, category: 'Estructura (Beams/Rafters)', name: '3x8 Header Beam', color: 'Siennawood', lengthFt: 14, lengthIn: 2, cut: 'COE', qty: 1, location: 'Rack A' }
        ]);
        const [baseItems, setBaseItems] = useState(BASE_ITEMS_INIT);
        const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
        const [importText, setImportText] = useState('');

        const [newItem, setNewItem] = useState({
          category: 'Estructura (Beams/Rafters)',
          name: '3x8 Header Beam',
          color: 'Siennawood',
          lengthFt: 0,
          lengthIn: 0,
          cut: 'STK',
          qty: 1,
          location: 'Bodega'
        });

        const lowStockItems = useMemo(
          () => baseItems.filter(item => item.currentStock < item.minStock),
          [baseItems]
        );

        const handleAddItem = (e) => {
          e.preventDefault();
          const item = {
            id: Date.now(),
            ...newItem
          };
          setAluminumItems([...aluminumItems, item]);
          setNewItem({ ...newItem, lengthFt: 0, lengthIn: 0, qty: 1 });
        };

        const handleDeleteItem = (id) => {
          setAluminumItems(aluminumItems.filter(i => i.id !== id));
        };

        const updateBaseStock = (id, val) => {
          const newStock = parseInt(val) || 0;
          setBaseItems(baseItems.map(item =>
            item.id === id ? { ...item, currentStock: newStock } : item
          ));
        };

        const exportToCSV = () => {
          let csvContent = "data:text/csv;charset=utf-8,";

          csvContent += "INVENTARIO ALUMINIO (SOBRANTES)\n";
          csvContent += "Categoria,Item,Color,Largo (ft),Pulg (in),Corte,Cantidad,Ubicacion\n";
          aluminumItems.forEach(row => {
            csvContent += `${row.category},${row.name},${row.color},${row.lengthFt},${row.lengthIn},${row.cut},${row.qty},${row.location}\n`;
          });

          csvContent += "\nMATERIAL BASE Y CONSUMIBLES\n";
          csvContent += "Categoria,Item,Stock Actual,Stock Minimo,Unidad,Estado\n";
          baseItems.forEach(row => {
            const status = row.currentStock < row.minStock ? "PEDIR" : "OK";
            csvContent += `${row.category},${row.name},${row.currentStock},${row.minStock},${row.unit},${status}\n`;
          });

          const encodedUri = encodeURI(csvContent);
          const link = document.createElement("a");
          link.setAttribute("href", encodedUri);
          link.setAttribute("download", "inventario_patio_covers.csv");
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        };

        const handleImportCategories = () => {
          if (!importText.trim()) return;
          try {
            const parsed = JSON.parse(importText);
            const merged = { ...categories };
            Object.entries(parsed).forEach(([cat, items]) => {
              if (!Array.isArray(items)) return;
              merged[cat] = [...new Set([...(merged[cat] || []), ...items])];
            });
            setCategories(merged);
            if (Object.keys(parsed).length > 0) {
              const firstCategory = Object.keys(parsed)[0];
              setNewItem({
                ...newItem,
                category: firstCategory,
                name: parsed[firstCategory][0] || newItem.name
              });
            }
            alert('Categorías importadas correctamente');
          } catch (err) {
            alert('El formato no es válido. Usa JSON como {"Nombre Categoria": ["Item 1", "Item 2"]}');
          }
        };

        return (
          <div className="min-h-screen bg-slate-50 font-sans text-slate-800 p-4 md:p-8">
            <div className="max-w-6xl mx-auto mb-8 flex flex-col md:flex-row justify-between items-center">
              <div>
                <h1 className="text-3xl font-bold text-slate-900 flex items-center gap-2">
                  <span className="text-blue-600">📦</span>
                  Control de Bodega: Patio Covers
                </h1>
                <p className="text-slate-500 mt-1">Gestión de Inventario Duralum y Material Base</p>
              </div>
              <button
                onClick={exportToCSV}
                className="mt-4 md:mt-0 flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg shadow transition-colors"
              >
                ⬇️ Descargar Excel (.csv)
              </button>
            </div>

            <div className="max-w-6xl mx-auto mb-6 flex gap-2 overflow-x-auto pb-2">
              <button
                onClick={() => setActiveTab('aluminum')}
                className={`flex items-center gap-2 px-6 py-3 rounded-t-lg font-medium transition-colors ${activeTab === 'aluminum' ? 'bg-white text-blue-600 shadow-sm border-t-4 border-blue-600' : 'bg-slate-200 text-slate-600 hover:bg-slate-300'}`}
              >
                🧮 Sobrantes de Aluminio
              </button>
              <button
                onClick={() => setActiveTab('base')}
                className={`flex items-center gap-2 px-6 py-3 rounded-t-lg font-medium transition-colors ${activeTab === 'base' ? 'bg-white text-blue-600 shadow-sm border-t-4 border-blue-600' : 'bg-slate-200 text-slate-600 hover:bg-slate-300'}`}
              >
                🔧 Hardware y Base
              </button>
              <button
                onClick={() => setActiveTab('order')}
                className={`flex items-center gap-2 px-6 py-3 rounded-t-lg font-medium transition-colors relative ${activeTab === 'order' ? 'bg-white text-blue-600 shadow-sm border-t-4 border-blue-600' : 'bg-slate-200 text-slate-600 hover:bg-slate-300'}`}
              >
                ⚠️ Generador de Orden
                {lowStockItems.length > 0 && (
                  <span className="ml-2 bg-red-500 text-white text-xs font-bold px-2 py-0.5 rounded-full animate-pulse">
                    {lowStockItems.length}
                  </span>
                )}
              </button>
            </div>

            <div className="max-w-6xl mx-auto bg-white rounded-lg shadow-sm border border-slate-200 min-h-[500px] p-6">
              {activeTab === 'aluminum' && (
                <div className="animate-fade-in space-y-6">
                  <div className="bg-slate-50 p-4 rounded-lg border border-slate-200">
                    <h3 className="font-bold text-lg mb-2 text-slate-700 flex items-center gap-2">
                      ➕ Agregar Nuevo Retazo
                    </h3>
                    <p className="text-sm text-slate-500 mb-4">Puedes pegar nuevo catálogo en formato JSON para añadir categorías e ítems rápidamente.</p>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                      <textarea
                        className="w-full p-3 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 text-sm"
                        rows="4"
                        placeholder='Ejemplo: {"Vigas Personalizadas": ["3x10 Header Beam", "2x8 Rafter"]}'
                        value={importText}
                        onChange={(e) => setImportText(e.target.value)}
                      ></textarea>
                      <div className="md:col-span-2 flex items-start gap-2">
                        <button
                          onClick={handleImportCategories}
                          className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded font-bold shadow"
                        >
                          Importar catálogo
                        </button>
                        <div className="text-xs text-slate-500 leading-relaxed">
                          Pega el JSON generado a partir de los PDFs. Cada clave es una categoría y el valor es una lista de items. Si repites una categoría se fusionan sin duplicados.
                        </div>
                      </div>
                    </div>
                    <form onSubmit={handleAddItem} className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-4 items-end">
                      <div className="col-span-2">
                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Categoría</label>
                        <select
                          className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                          value={newItem.category}
                          onChange={(e) => setNewItem({
                            ...newItem,
                            category: e.target.value,
                            name: (categories[e.target.value] || [])[0] || ''
                          })}
                        >
                          {Object.keys(categories).map(cat => (
                            <option key={cat} value={cat}>{cat}</option>
                          ))}
                        </select>
                      </div>

                      <div className="col-span-2">
                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Item / Perfil</label>
                        <select
                          className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                          value={newItem.name}
                          onChange={(e) => setNewItem({...newItem, name: e.target.value})}
                        >
                          {(categories[newItem.category] || []).map(item => (
                            <option key={item} value={item}>{item}</option>
                          ))}
                        </select>
                      </div>

                      <div className="col-span-2 lg:col-span-1">
                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Color</label>
                        <select
                          className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                          value={newItem.color}
                          onChange={(e) => setNewItem({...newItem, color: e.target.value})}
                        >
                          {COLORS.map(c => <option key={c} value={c}>{c}</option>)}
                        </select>
                      </div>

                      <div className="col-span-1">
                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Pies (Ft)</label>
                        <input
                          type="number" min="0"
                          className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                          value={newItem.lengthFt}
                          onChange={(e) => setNewItem({...newItem, lengthFt: parseInt(e.target.value) || 0})}
                        />
                      </div>

                      <div className="col-span-1">
                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Pulg (In)</label>
                        <input
                          type="number" min="0" max="11"
                          className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                          value={newItem.lengthIn}
                          onChange={(e) => setNewItem({...newItem, lengthIn: parseInt(e.target.value) || 0})}
                        />
                      </div>

                      <div className="col-span-2 lg:col-span-1">
                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Corte</label>
                        <select
                          className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                          value={newItem.cut}
                          onChange={(e) => setNewItem({...newItem, cut: e.target.value})}
                        >
                          {CUT_TYPES.map(c => <option key={c.code} value={c.code}>{c.code}</option>)}
                        </select>
                      </div>

                      <div className="col-span-1">
                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Cant.</label>
                        <input
                          type="number" min="1"
                          className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                          value={newItem.qty}
                          onChange={(e) => setNewItem({...newItem, qty: parseInt(e.target.value) || 1})}
                        />
                      </div>

                      <div className="col-span-2 lg:col-span-1">
                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Ubicación</label>
                        <input
                          type="text"
                          className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                          value={newItem.location}
                          onChange={(e) => setNewItem({...newItem, location: e.target.value})}
                        />
                      </div>

                      <div className="col-span-2 lg:col-span-1">
                        <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white p-2 rounded text-sm font-bold shadow transition-colors">
                          Guardar
                        </button>
                      </div>
                    </form>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse">
                      <thead>
                        <tr className="bg-slate-100 border-b border-slate-300">
                          <th className="p-3 text-xs font-bold text-slate-500 uppercase">Item</th>
                          <th className="p-3 text-xs font-bold text-slate-500 uppercase">Color</th>
                          <th className="p-3 text-xs font-bold text-slate-500 uppercase">Largo</th>
                          <th className="p-3 text-xs font-bold text-slate-500 uppercase">Corte</th>
                          <th className="p-3 text-xs font-bold text-slate-500 uppercase text-center">Cant.</th>
                          <th className="p-3 text-xs font-bold text-slate-500 uppercase">Ubicación</th>
                          <th className="p-3 text-xs font-bold text-slate-500 uppercase text-right">Acción</th>
                        </tr>
                      </thead>
                      <tbody>
                        {aluminumItems.length === 0 ? (
                          <tr><td colSpan={7} className="p-8 text-center text-slate-400 italic">No hay material registrado. Agrega items arriba.</td></tr>
                        ) : (
                          aluminumItems.map((item) => (
                            <tr key={item.id} className="border-b border-slate-100 hover:bg-slate-50 group">
                              <td className="p-3 text-slate-800 font-medium">
                                {item.name}
                                <div className="text-xs text-slate-400 font-normal">{item.category}</div>
                              </td>
                              <td className="p-3">
                                <span className="px-2 py-1 bg-slate-200 text-slate-700 rounded text-xs font-bold border border-slate-300">
                                  {item.color}
                                </span>
                              </td>
                              <td className="p-3 font-mono text-slate-700">
                                {item.lengthFt}' {item.lengthIn}"
                              </td>
                              <td className="p-3">
                                <span className={`text-xs font-bold px-2 py-1 rounded ${item.cut === 'STK' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}`}>
                                  {item.cut}
                                </span>
                              </td>
                              <td className="p-3 text-center font-bold text-lg">{item.qty}</td>
                              <td className="p-3 text-sm text-slate-500">{item.location}</td>
                              <td className="p-3 text-right">
                                <button
                                  onClick={() => handleDeleteItem(item.id)}
                                  className="text-slate-400 hover:text-red-500 transition-colors p-1"
                                >
                                  🗑️
                                </button>
                              </td>
                            </tr>
                          ))
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {activeTab === 'base' && (
                <div className="animate-fade-in">
                  <h3 className="font-bold text-lg mb-4 text-slate-700">Control de Stock: Consumibles</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {baseItems.map(item => {
                      const isLow = item.currentStock < item.minStock;
                      return (
                        <div key={item.id} className={`p-4 rounded-lg border-2 transition-all ${isLow ? 'border-red-200 bg-red-50' : 'border-slate-100 bg-white hover:border-blue-200'}`}>
                          <div className="flex justify-between items-start mb-2">
                            <span className="text-xs font-bold uppercase text-slate-400">{item.category}</span>
                            {isLow && <span className="text-xs font-bold bg-red-500 text-white px-2 py-1 rounded">PEDIR</span>}
                          </div>
                          <div className="font-bold text-slate-800 text-lg mb-4 leading-tight">{item.name}</div>

                          <div className="flex items-center justify-between">
                            <div className="text-sm text-slate-500">
                              Mínimo: <span className="font-mono">{item.minStock}</span> {item.unit}
                            </div>
                            <div className="flex items-center gap-2">
                              <label className="text-xs font-bold text-slate-600">Actual:</label>
                              <input
                                type="number"
                                className={`w-20 p-1 text-center font-bold rounded border outline-none focus:ring-2 ${isLow ? 'border-red-300 text-red-700 bg-white focus:ring-red-200' : 'border-slate-300 text-slate-700 focus:ring-blue-200'}`}
                                value={item.currentStock}
                                onChange={(e) => updateBaseStock(item.id, e.target.value)}
                              />
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {activeTab === 'order' && (
                <div className="animate-fade-in max-w-4xl mx-auto">
                  <div className="bg-amber-50 border border-amber-200 rounded-lg p-6 mb-8">
                    <h2 className="text-xl font-bold text-amber-900 mb-4 flex items-center gap-2">
                      📋 Pedido Sugerido
                    </h2>
                    <p className="text-amber-800 mb-4 text-sm">
                      Basado en tu stock mínimo, estos son los artículos que deberías pedir a Duralum o comprar en Home Depot.
                    </p>

                    {lowStockItems.length === 0 ? (
                      <div className="bg-white/50 p-4 rounded text-center text-amber-800 font-medium">
                        ✅ Todo el stock base parece estar bien. No hay alertas automáticas.
                      </div>
                    ) : (
                      <table className="w-full text-left bg-white rounded-lg overflow-hidden border border-amber-100 mb-4">
                        <thead className="bg-amber-100/50">
                          <tr>
                            <th className="p-3 text-xs font-bold text-amber-800 uppercase">Artículo</th>
                            <th className="p-3 text-xs font-bold text-amber-800 uppercase">Faltante Est.</th>
                            <th className="p-3 text-xs font-bold text-amber-800 uppercase">Estado</th>
                          </tr>
                        </thead>
                        <tbody>
                          {lowStockItems.map(item => (
                            <tr key={item.id} className="border-b border-amber-50 last:border-0">
                              <td className="p-3 font-medium text-slate-700">{item.name}</td>
                              <td className="p-3 text-red-600 font-bold">
                                {item.minStock - item.currentStock} {item.unit}
                              </td>
                              <td className="p-3">
                                <span className="text-xs bg-red-100 text-red-700 px-2 py-1 rounded font-bold">CRÍTICO</span>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    )}
                  </div>

                  <div className="bg-blue-50 border-l-4 border-blue-500 p-4">
                    <h4 className="font-bold text-blue-900 mb-2">Instrucciones para ordenar:</h4>
                    <ul className="list-disc list-inside text-sm text-blue-800 space-y-1">
                      <li>Revisa los sobrantes en la pestaña "Sobrantes" antes de pedir vigas nuevas.</li>
                      <li>Usa el botón "Descargar Excel" arriba para guardar este reporte.</li>
                      <li>Envía el pedido a <b>phoenixsales@duralum.com</b></li>
                    </ul>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<PatioInventoryManager />);
    </script>
  </body>
</html>
