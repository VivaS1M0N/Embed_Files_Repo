<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viva | Control de Bodega</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      :root{
        --ink:#0f172a; --muted:#475569; --bg:#f6f7f6; --card:#ffffff; --border:#e2e8f0;
        --primary:#1f6f5b; --primary2:#165446; --accent:#b78a3a;
        --danger:#b42318; --warning:#b45309; --success:#15803d;
        --shadow: 0 10px 30px rgba(2, 6, 23, .08);
        --shadowSoft: 0 10px 30px rgba(2, 6, 23, .06);
        --rXl: 26px; --rLg: 22px; --rMd: 16px; --rSm: 12px;
      }
      *{ box-sizing: border-box; }
      html, body{ height: 100%; }
      body{
        margin:0; background: var(--bg); color: var(--ink);
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; line-height: 1.35;
      }
      .topstripe{ height: 12px; background: linear-gradient(90deg, var(--primary), var(--accent)); }
      .shell{ max-width: 1200px; margin: 0 auto; padding: 22px 16px 44px; }
      .card{ background: var(--card); border:1px solid var(--border); border-radius: var(--rXl); box-shadow: var(--shadow); }
      .header{ padding: 18px 18px 18px; }
      @media (min-width: 900px){ .header{ padding: 24px 24px 20px; } }
      .headerTop{ display:flex; gap: 18px; align-items:flex-start; justify-content: space-between; flex-wrap: wrap; }
      .brand{ display:flex; align-items:flex-start; gap: 14px; min-width: 280px; }
      .brandLogoWrap{
        height: 52px; width: 52px; border-radius: 18px;
        display:flex; align-items:center; justify-content:center;
        background: #fff; border: 1px solid rgba(2,6,23,.10); box-shadow: 0 10px 24px rgba(2,6,23,.08);
        overflow:hidden; flex: 0 0 auto;
      }
      .brandLogoWrap img{ width: 100%; height: 100%; object-fit: cover; }
      .kicker{ color: #64748b; font-weight: 900; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
      .h1{ margin: 0; font-size: 28px; letter-spacing: -0.02em; font-weight: 900; }
      .subtitle{ margin: 8px 0 0; color: var(--muted); font-size: 14px; font-weight: 650; max-width: 70ch; }

      .actions{ display:flex; gap: 10px; flex-wrap: wrap; align-items:center; }
      .btn{
        display:inline-flex; align-items:center; gap:.55rem;
        border: 1px solid rgba(2,6,23,.10);
        padding:.60rem .96rem; border-radius: 999px; font-weight: 900;
        background: #fff; box-shadow: 0 6px 16px rgba(2,6,23,.07);
        cursor:pointer; user-select: none;
      }
      .btn:active{ transform: translateY(1px); }
      .btnPrimary{ background: var(--primary); color:#fff; border-color: rgba(255,255,255,.15); }
      .btnPrimary:hover{ background: var(--primary2); }
      .btnDanger{ background: #fff; border-color: rgba(180,35,24,.25); color: var(--danger); }
      .btnDangerFill{ background: var(--danger); color:#fff; border-color: rgba(255,255,255,.15); }
      .btnDangerFill:hover{ filter: brightness(.95); }
      .btnGhost{ background: transparent; box-shadow:none; }
      .btnSm{ padding:.45rem .72rem; font-size: 12px; }

      .chip{
        display:inline-flex; align-items:center; gap:.45rem;
        padding:.24rem .62rem; border-radius: 999px;
        border:1px solid var(--border); background: #f8fafc; font-weight: 900; font-size: 12px; color: #0f172a;
      }
      .chipWarn{ background:#fffbeb; border-color:#fde68a; color:#92400e; }
      .chipOk{ background:#ecfdf5; border-color:#a7f3d0; color:#065f46; }
      .chipBad{ background:#fee2e2; border-color:#fecaca; color:#991b1b; }
      .chipSoft{ background: rgba(31,111,91,.08); border-color: rgba(31,111,91,.20); color: var(--primary2); }
      .chipCutStk{ background:#dcfce7; border-color:#bbf7d0; color:#166534; }
      .chipCutOth{ background:#ffedd5; border-color:#fed7aa; color:#9a3412; }

      .stats{ margin-top: 16px; display:grid; grid-template-columns: 1fr; gap: 12px; }
      @media (min-width: 780px){ .stats{ grid-template-columns: repeat(3, minmax(0, 1fr)); } }
      .stat{ border: 1px solid var(--border); border-radius: var(--rLg); padding: 14px 14px; background: #fff; box-shadow: var(--shadowSoft); }
      .statLabel{ font-size: 11px; font-weight: 900; color: #64748b; text-transform: uppercase; letter-spacing: .06em; }
      .statValue{ margin-top: 8px; font-size: 26px; font-weight: 900; letter-spacing: -.02em; }
      .statHint{ margin-top: 6px; font-size: 13px; color: #64748b; font-weight: 650; }

      .topTabs{ margin-top: 14px; display:flex; gap: 10px; flex-wrap: wrap; align-items:center; }
      .topTab{
        display:inline-flex; align-items:center; gap: 10px;
        padding: 10px 14px; border-radius: 999px;
        background: rgba(255,255,255,.65); border: 1px solid rgba(2,6,23,.10);
        cursor:pointer; font-weight: 900; box-shadow: 0 6px 16px rgba(2,6,23,.05);
      }
      .topTab:hover{ background: #fff; }
      .topTab.active{ background:#fff; border-color: rgba(31,111,91,.45); }

      .main{ margin-top: 12px; padding: 16px; min-height: 620px; }
      @media (min-width: 900px){ .main{ padding: 22px; } }

      .invLayout{ display:grid; grid-template-columns: 1fr; gap: 14px; }
      @media (min-width: 980px){ .invLayout{ grid-template-columns: 340px 1fr; gap: 16px; } }
      .panel{ border:1px solid var(--border); background:#fff; border-radius: var(--rXl); padding: 16px; box-shadow: var(--shadowSoft); }
      .panelTitle{ margin: 0; font-size: 14px; font-weight: 900; letter-spacing: -.01em; }
      .panelSub{ margin: 8px 0 0; color:#64748b; font-weight: 650; font-size: 13px; line-height: 1.55; }

      .invList{ margin-top: 14px; display:flex; flex-direction: column; gap: 10px; }
      .invBtn{
        width:100%; display:flex; align-items:center; justify-content: space-between; gap: 10px;
        padding: 12px 12px; border-radius: 20px;
        border: 1px solid rgba(2,6,23,.10); background: rgba(248,250,252,.55);
        cursor:pointer; box-shadow: 0 6px 16px rgba(2,6,23,.05);
      }
      .invBtn:hover{ background:#fff; }
      .invBtn.active{ background:#fff; border-color: rgba(31,111,91,.45); }
      .invLeft{ display:flex; align-items:center; gap: 12px; min-width: 0; }
      .invIcon{
        height: 40px; width: 40px; border-radius: 16px;
        display:flex; align-items:center; justify-content:center;
        background: #f1f5f9; border: 1px solid var(--border); flex: 0 0 auto;
      }
      .invText{ min-width: 0; }
      .invName{ font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .invMeta{ font-size: 12px; font-weight: 800; color:#64748b; margin-top: 4px; line-height: 1.35; }

      .section{ border: 1px solid var(--border); background:#fff; border-radius: var(--rXl); padding: 16px; box-shadow: var(--shadowSoft); }
      @media (min-width: 900px){ .section{ padding: 18px; } }
      .sectionTop{ display:flex; justify-content: space-between; align-items:flex-start; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
      .section h3{ margin: 0; font-size: 18px; font-weight: 900; }
      .section p{ margin: 8px 0 0; color:#64748b; font-size: 13px; font-weight: 650; line-height: 1.65; }

      .grid{ display:grid; gap: 14px; }
      .grid12{ grid-template-columns: repeat(12, minmax(0, 1fr)); }
      .col12{ grid-column: span 12; }
      @media (min-width: 900px){
        .colMd2{ grid-column: span 2; }
        .colMd3{ grid-column: span 3; }
        .colMd4{ grid-column: span 4; }
        .colMd5{ grid-column: span 5; }
        .colMd6{ grid-column: span 6; }
        .colMd7{ grid-column: span 7; }
        .colMd8{ grid-column: span 8; }
      }

      .label{
        display:block; margin-bottom: 6px; font-size: 11px; font-weight: 900;
        color:#64748b; text-transform: uppercase; letter-spacing: .06em;
      }
      .input{
        width:100%; border:1px solid var(--border); border-radius: 16px;
        padding:.66rem .80rem; outline:none; font-size: 14px; font-weight: 650; color: #0f172a; background: #fff;
      }
      .input:focus{ box-shadow: 0 0 0 4px rgba(31, 111, 91, .15); border-color: rgba(31,111,91,.45); }
      textarea.input{ resize: vertical; min-height: 130px; }

      .hr{ height:1px; background: #eef2f7; border:0; margin: 14px 0; }

      .tableWrap{ overflow-x:auto; border: 1px solid var(--border); border-radius: var(--rXl); background:#fff; }
      table{ width:100%; border-collapse: collapse; }
      thead th{
        position: sticky; top: 0; background: #f8fafc; z-index: 1;
        text-align:left; padding: 12px; font-size: 11px; font-weight: 900;
        text-transform: uppercase; letter-spacing: .06em; color: #64748b; border-bottom: 1px solid var(--border);
      }
      tbody td{ padding: 12px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
      tbody tr:hover{ background: #f8fafc; }
      .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }

      .cards{ display:grid; grid-template-columns: 1fr; gap: 14px; }
      @media (min-width: 980px){ .cards{ grid-template-columns: repeat(3, minmax(0,1fr)); } }
      .itemCard{ border:1px solid var(--border); border-radius: var(--rXl); padding: 14px; background:#fff; box-shadow: var(--shadowSoft); }
      .itemCard.low{ border-color: rgba(180,83,9,.25); box-shadow: 0 10px 30px rgba(180,83,9,.10); }
      .rowBetween{ display:flex; justify-content: space-between; align-items:center; gap: 12px; flex-wrap: wrap; }
      .row{ display:flex; gap: 10px; flex-wrap: wrap; align-items:center; }

      .pillList{ display:flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
      .pill{
        display:flex; align-items:center; gap: 10px;
        padding: 10px 12px; border-radius: 16px;
        border:1px solid var(--border); background: #fff; box-shadow: 0 6px 16px rgba(2,6,23,.05);
      }
      .pillName{ font-weight: 900; }
      .pillSmall{ font-size: 12px; font-weight: 800; color:#64748b; }

      .toast{
        position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
        padding: 12px 14px; border-radius: 16px; border: 1px solid var(--border);
        box-shadow: var(--shadow); background: #fff; min-width: 240px; text-align:center; font-weight: 900;
        z-index: 50;
      }
      .fadeIn { animation: fadeIn .22s ease-out; }
      @keyframes fadeIn { from { opacity:0; transform: translate(-50%, 8px);} to {opacity:1; transform: translate(-50%, 0);} }

      /* Collapsible panel */
      .collapse{ overflow:hidden; border: 1px solid var(--border); border-radius: var(--rXl); background:#fff; box-shadow: var(--shadowSoft); }
      .collapseHead{ padding: 12px 14px; display:flex; align-items:center; justify-content: space-between; gap: 12px; cursor:pointer; background: #fff; }
      .collapseTitle{ display:flex; align-items:center; gap: 10px; font-weight: 900; }
      .collapseBody{ padding: 14px; border-top: 1px solid #eef2f7; }

      /* Modal confirm */
      .modalOverlay{
        position: fixed; inset: 0; background: rgba(2,6,23,.55);
        display:flex; align-items:center; justify-content:center; padding: 18px; z-index: 60;
      }
      .modal{
        width: 100%; max-width: 520px;
        background: #fff; border:1px solid rgba(255,255,255,.12);
        border-radius: 22px; box-shadow: 0 18px 55px rgba(2,6,23,.28);
        overflow:hidden;
      }
      .modalTop{ padding: 16px 16px 0; }
      @media (min-width: 900px){ .modalTop{ padding: 18px 18px 0; } }
      .modalTitle{ margin: 0; font-size: 18px; font-weight: 900; letter-spacing: -.01em; }
      .modalBody{ padding: 12px 16px 16px; color:#334155; font-weight: 650; line-height: 1.6; }
      @media (min-width: 900px){ .modalBody{ padding: 12px 18px 18px; } }
      .modalActions{ display:flex; gap: 10px; padding: 14px 16px 16px; border-top: 1px solid #eef2f7; justify-content:flex-end; }
      @media (min-width: 900px){ .modalActions{ padding: 14px 18px 18px; } }
      .countdown{
        display:inline-flex; align-items:center; gap: 8px;
        padding: 8px 10px; border-radius: 14px; background:#fffbeb; border:1px solid #fde68a;
        color:#92400e; font-weight: 900; margin-top: 12px;
      }
      .hintMuted{ color:#64748b; font-weight: 650; font-size: 13px; }

      .dangerHint{ color: var(--danger); font-weight: 900; }
    </style>
  </head>

    <div id="root"></div>

      function normalizeInventory(inv){
        if (!inv || typeof inv !== "object") return null;
        const id = String(inv.id || "").trim();
        const title = String(inv.title || "").trim();
        const icon = inv.icon || "📦";
        const mode = String(inv.mode || inv.kind || "").trim();
        if (!id || !title || !mode) return null;

        const typeLabel = String(inv.typeLabel || (mode === "stock" ? "Stock" : mode === "lot" ? "Sobrantes" : mode)).trim() || mode;

        const schema = (mode !== "lot" && mode !== "stock")
          ? (inv.schema && typeof inv.schema === "object" ? inv.schema : DEFAULT_CUSTOM_SCHEMA)
          : undefined;

        return {
          id, title, icon,
          mode,
          typeLabel,
          categories: mode === "lot" ? (inv.categories || {}) : undefined,
          schema,
          items: Array.isArray(inv.items) ? inv.items : []

      function ConfirmModal({ open, title, body, dangerLabel, onCancel, onConfirm, seconds = 5 }){
        const [remaining, setRemaining] = useState(seconds);
        const [armed, setArmed] = useState(false);

        useEffect(() => {
          if (!open) return;
          setRemaining(seconds);
          setArmed(false);
          const t = setInterval(() => {
            setRemaining(r => {
              if (r <= 1){
                clearInterval(t);
                setArmed(true);
                return 0;
              }
              return r - 1;
            });
          }, 1000);
          return () => clearInterval(t);
        }, [open, seconds]);

        if (!open) return null;

        return (
          <div className="modalOverlay" role="dialog" aria-modal="true">
            <div className="modal">
              <div className="modalTop">
                <div className="rowBetween">
                  <h4 className="modalTitle">{title}</h4>
                  <button className="btn btnSm" onClick={onCancel}>✖️</button>
                </div>
              </div>
              <div className="modalBody">
                <div>{body}</div>
                <div className="countdown">
                  ⏱️ {armed ? "Listo para confirmar" : `Espera ${remaining}s para confirmar`}
                </div>
                <div className="hintMuted" style={{ marginTop: 10 }}>
                  Esto evita borrados accidentales.
                </div>
              </div>
              <div className="modalActions">
                <button className="btn" onClick={onCancel}>Cancelar</button>
                <button className={"btn btnDangerFill"} onClick={onConfirm} disabled={!armed} style={{ opacity: armed ? 1 : .55, cursor: armed ? "pointer" : "not-allowed" }}>
                  {dangerLabel}
                </button>
              </div>
            </div>
          </div>
        );
      }

        function addCustomItem(e){

        function bumpStock(invId, itemId, delta){
          updateInventory(invId, inv => ({ ...inv, items: (inv.items || []).map(it => {
            if (it.id !== itemId) return it;
            const next = Math.max(0, (parseInt(it.currentStock) || 0) + delta);
            return { ...it, currentStock: next };
          })}));

        function importCategoriesForActive(){
          if (!activeInv || activeInv.mode !== "lot") return;
          const parsed = safeParseJSON(importItemsText);
          if (!parsed || typeof parsed !== "object" || !parsed.categories){
            alert('Formato inválido. Usa {"categories":{"Nombre Categoria":["Item 1","Item 2"]}}');
            return;
          }
          const incoming = parsed.categories;
          if (!incoming || typeof incoming !== "object"){ alert("categories debe ser un objeto."); return; }
          updateInventory(activeInv.id, inv => {
            const merged = { ...(inv.categories || {}) };
            Object.entries(incoming).forEach(([cat, items]) => {
              if (!Array.isArray(items)) return;
              merged[cat] = [...new Set([...(merged[cat] || []), ...items])];
            });
            return { ...inv, categories: merged };
          });
          const firstCat = Object.keys(incoming)[0];
          if (firstCat){
            setNewLotItem(p => ({ ...p, category: firstCat, name: (incoming[firstCat] && incoming[firstCat][0]) ? incoming[firstCat][0] : p.name }));
          }
          setToast({ type:"ok", message:"Catálogo actualizado." });
        }

        function importItemsForActive(){
          const inv = activeInv;
          const parsed = safeParseJSON(importItemsText);
          if (!parsed || typeof parsed !== "object" || !Array.isArray(parsed.items)){
            alert('Formato inválido. Usa {"items":[...]}');
            return;
          }

          if (inv.mode === "lot"){
            const cleaned = parsed.items.map(x => ({
              id: nowId(),
              category: x.category || "Sin categoría",
              name: x.name || "Sin nombre",
              color: x.color || "White",
              lengthFt: parseInt(x.lengthFt) || 0,
              lengthIn: parseInt(x.lengthIn) || 0,
              cut: x.cut || "STK",
              qty: parseInt(x.qty) || 1,
              location: x.location || "Bodega"
            }));
            updateInventory(inv.id, v => ({ ...v, items: [...cleaned, ...(v.items || [])] }));
            setToast({ type:"ok", message:`Importados ${cleaned.length} ítems.` });
          } else if (inv.mode === "stock"){
            const cleaned = parsed.items.map(x => ({
              id: nowId(),
              category: x.category || "General",
              name: x.name || "Sin nombre",
              unit: x.unit || "pzs",
              minStock: parseInt(x.minStock) || 0,
              currentStock: parseInt(x.currentStock) || 0
            }));
            updateInventory(inv.id, v => ({ ...v, items: [...cleaned, ...(v.items || [])] }));
            setToast({ type:"ok", message:`Importados ${cleaned.length} ítems.` });
          } else {
            const schema = (inv.schema && inv.schema.fields) ? inv.schema : DEFAULT_CUSTOM_SCHEMA;
            const cleaned = parsed.items.map(x => {
              const row = { id: nowId() };
              for (const f of (schema.fields || [])){
                let val = x[f.key];
                if (val === undefined || val === null || val === ""){
                  if (f.default !== undefined) val = f.default;
                  else val = "";
                }
                if (f.type === "number") val = parseFloat(val) || 0;
                row[f.key] = val;
              }
              return row;
            });
            updateInventory(inv.id, v => ({ ...v, items: [...cleaned, ...(v.items || [])] }));
            setToast({ type:"ok", message:`Importados ${cleaned.length} ítems.` });
          }

        function importInventories(){
          const parsed = safeParseJSON(importInventoriesText);
          if (!parsed || typeof parsed !== "object" || !Array.isArray(parsed.inventories)){
            alert('Formato inválido. Usa {"inventories":[{"id":"papers","title":"Papers","icon":"📄","mode":"stock","typeLabel":"Stock"}]}');
            return;
          }
          const incoming = [];
          for (const raw of parsed.inventories){
            const norm = normalizeInventory(raw);
            if (norm) incoming.push(norm);
          }
          if (!incoming.length){ alert("No se encontró ningún inventario válido."); return; }

          setInventories(prev => {
            const byId = new Map(prev.map(x => [x.id, x]));
            for (const inv of incoming){
              if (byId.has(inv.id)){
                const old = byId.get(inv.id);
                const merged = { ...old, title: inv.title || old.title, icon: inv.icon || old.icon, typeLabel: inv.typeLabel || old.typeLabel };

                if (old.mode === "lot"){
                  const mergedCats = { ...(old.categories || {}) };
                  const incCats = inv.categories || {};
                  Object.entries(incCats).forEach(([cat, items]) => {
                    if (!Array.isArray(items)) return;
                    mergedCats[cat] = [...new Set([...(mergedCats[cat] || []), ...items])];
                  });
                  merged.categories = mergedCats;
                }
                if (old.mode !== "lot" && old.mode !== "stock"){
                  if (inv.schema && typeof inv.schema === "object") merged.schema = inv.schema;
                }

                if (Array.isArray(inv.items) && inv.items.length){
                  merged.items = [...inv.items.map(x => ({ id: nowId(), ...x })), ...(old.items || [])];
                }
                byId.set(inv.id, merged);
              } else {
                byId.set(inv.id, inv);
              }
            }
            return Array.from(byId.values());
          });

          setToast({ type:"ok", message:`Inventarios importados: ${incoming.length}` });
          const first = incoming[0]?.id; if (first) setActiveInvId(first);
        }

        function createInventoryManual(){
          const id = (createInv.id || "").trim();
          const title = (createInv.title || "").trim();
          const icon = (createInv.icon || "📦").trim() || "📦";

          let mode = (createInv.mode || "").trim();
          if (mode === "custom") mode = (createInv.customMode || "custom").trim() || "custom";

          const typeLabel = (createInv.typeLabel || "").trim() || (mode === "stock" ? "Stock" : mode === "lot" ? "Sobrantes" : mode);

          if (!id || !title){ setToast({ type:"warn", message:"Completa id y título." }); return; }
          if (!/^[a-z0-9-_]+$/i.test(id)){ setToast({ type:"warn", message:"El id solo debe usar letras/números/guion/underscore (sin espacios)." }); return; }
          if (inventories.find(x => x.id === id)){ setToast({ type:"warn", message:"Ese id ya existe. Usa otro." }); return; }
          if (!mode){ setToast({ type:"warn", message:"Define un mode." }); return; }

          let schema = undefined;
          if (mode !== "lot" && mode !== "stock"){
            const parsed = safeParseJSON(createInv.schemaText);
            if (!parsed || typeof parsed !== "object" || !Array.isArray(parsed.fields)){
              setToast({ type:"warn", message:"Schema inválido. Debe ser JSON con { fields: [...] }." });
              return;
            }
            schema = parsed;
          }

          const inv = {
            id, title, icon, mode, typeLabel,
            categories: mode === "lot" ? {} : undefined,
            schema: schema,
            items: []
          };
          setInventories(prev => [inv, ...prev]);
          setActiveInvId(id);
          setCreateInv({ id:"", title:"", icon:"📦", mode:"stock", customMode:"custom", typeLabel:"", schemaText: JSON.stringify(DEFAULT_CUSTOM_SCHEMA, null, 2) });
          setToast({ type:"ok", message:"Inventario creado." });
        }

          });

          return items.filter(it => [it.name,it.category,it.unit].join(" ").toLowerCase().includes(q));
        }, [activeInv, search]);

          if (!activeInv || activeInv.mode === "lot" || activeInv.mode === "stock") return [];

          if (!q) return items;

          const hint = activeInv.mode === "lot"

            : activeInv.mode === "stock"
              ? "Agrega ítems con mínimo y unidad. También puedes importar ítems en bloque."
              : "Inventario flexible: el formulario y tabla dependen del schema.fields. También puedes importar ítems en bloque.";

                <span>Agregar ítems</span>
                <span className="chip">{activeInv.title}</span>
              </div>
              <button className={"btn btnSm " + (addOpen ? "" : "btnPrimary")} onClick={(e)=>{ e.stopPropagation(); setAddOpen(o=>!o); }}>
                {addOpen ? "Cerrar" : "Abrir"}
              </button>
            </div>

          return (
            <div className="collapse">
              <div className="collapseHead" onClick={()=>setAddOpen(o=>!o)}>
                {head}
              </div>

                <div className="collapseBody">

                    <div>
                      <div className="kicker">Agregar / importar</div>

                    </div>

                    <div className="actions">
                      <button
                        className="btn"
                        onClick={() => {
                          if (activeInv.mode === "lot"){
                            setImportItemsText('{"categories":{"Nueva Categoria":["Item 1","Item 2"]}}');
                          } else if (activeInv.mode === "stock"){
                            setImportItemsText('{"items":[{"category":"General","name":"Ejemplo","unit":"pzs","minStock":10,"currentStock":2}]}');
                          } else {
                            setImportItemsText('{"items":[{"name":"Ejemplo","qty":1}]}');
                          }
                        }}

                      </button>

                      <button className="btn btnPrimary" onClick={() => { activeInv.mode === "lot" ? importCategoriesForActive() : importItemsForActive(); }}>

                  <div className="grid grid12" style={{ marginTop: 12 }}>

                        value={importItemsText}
                        onChange={(e)=>setImportItemsText(e.target.value)}

                      />
                      <div className="row" style={{ marginTop: 10 }}>
                        <button className="btn btnGhost" onClick={importItemsForActive}>📥 Importar ítems (bloque)</button>

                      </div>
                    </div>

                    <div className="col12 colMd8">
                      {activeInv.mode === "lot" && (
                        <form onSubmit={addLotItem} className="grid grid12">
                          <div className="col12 colMd6">
                            <label className="label">Categoría</label>
                            <select
                              className="input"
                              value={newLotItem.category}
                              onChange={(e) => {
                                const cat = e.target.value;
                                const cats = activeInv.categories || DEFAULT_CATEGORIES;
                                setNewLotItem(p => ({ ...p, category: cat, name: (cats[cat] || [])[0] || "" }));
                              }}
                            >
                              {Object.keys(activeInv.categories || DEFAULT_CATEGORIES).map(cat => (<option key={cat} value={cat}>{cat}</option>))}
                            </select>
                          </div>

                          <div className="col12 colMd6">
                            <label className="label">Ítem / Perfil</label>
                            <select className="input" value={newLotItem.name} onChange={(e)=>setNewLotItem(p=>({ ...p, name:e.target.value }))}>
                              {((activeInv.categories || DEFAULT_CATEGORIES)[newLotItem.category] || []).map(item => (<option key={item} value={item}>{item}</option>))}
                            </select>
                          </div>

                          <div className="col12 colMd3">
                            <label className="label">Color</label>
                            <select className="input" value={newLotItem.color} onChange={(e)=>setNewLotItem(p=>({ ...p, color:e.target.value }))}>
                              {COLORS.map(c => <option key={c} value={c}>{c}</option>)}
                            </select>
                          </div>

                          <div className="col12 colMd3">
                            <label className="label">Corte</label>
                            <select className="input" value={newLotItem.cut} onChange={(e)=>setNewLotItem(p=>({ ...p, cut:e.target.value }))}>
                              {CUT_TYPES.map(c => <option key={c.code} value={c.code}>{c.code}</option>)}
                            </select>
                          </div>

                          <div className="col12 colMd2">
                            <label className="label">Ft</label>
                            <input type="number" min="0" className="input" value={newLotItem.lengthFt}
                              onChange={(e)=>setNewLotItem(p=>({ ...p, lengthFt: parseInt(e.target.value) || 0 }))} />
                          </div>

                          <div className="col12 colMd2">
                            <label className="label">In</label>
                            <input type="number" min="0" max="11" className="input" value={newLotItem.lengthIn}
                              onChange={(e)=>setNewLotItem(p=>({ ...p, lengthIn: parseInt(e.target.value) || 0 }))} />
                          </div>

                          <div className="col12 colMd2">
                            <label className="label">Cant.</label>
                            <input type="number" min="1" className="input" value={newLotItem.qty}
                              onChange={(e)=>setNewLotItem(p=>({ ...p, qty: parseInt(e.target.value) || 1 }))} />
                          </div>

                          <div className="col12 colMd6">
                            <label className="label">Ubicación</label>
                            <input type="text" className="input" value={newLotItem.location}
                              onChange={(e)=>setNewLotItem(p=>({ ...p, location: e.target.value }))} />
                          </div>

                          <div className="col12 colMd6" style={{ display:"flex", alignItems:"end" }}>
                            <button type="submit" className="btn btnPrimary" style={{ width:"100%", justifyContent:"center" }}>✅ Guardar ítem</button>
                          </div>
                        </form>
                      )}

                      {activeInv.mode === "stock" && (
                        <form onSubmit={addStockItem} className="grid grid12">
                          <div className="col12 colMd6">
                            <label className="label">Categoría</label>
                            <input className="input" value={newStockItem.category} onChange={(e)=>setNewStockItem(p=>({ ...p, category:e.target.value }))} />
                          </div>
                          <div className="col12 colMd6">
                            <label className="label">Nombre del ítem</label>
                            <input className="input" value={newStockItem.name} onChange={(e)=>setNewStockItem(p=>({ ...p, name:e.target.value }))} placeholder="Ej. Tornillos, Sikaflex, Papel..." />
                          </div>

                          <div className="col12 colMd3">
                            <label className="label">Unidad</label>
                            <input className="input" value={newStockItem.unit} onChange={(e)=>setNewStockItem(p=>({ ...p, unit:e.target.value }))} placeholder="pzs, caja, sacos..." />
                          </div>
                          <div className="col12 colMd3">
                            <label className="label">Mínimo</label>
                            <input type="number" min="0" className="input" value={newStockItem.minStock}
                              onChange={(e)=>setNewStockItem(p=>({ ...p, minStock: parseInt(e.target.value) || 0 }))} />
                          </div>
                          <div className="col12 colMd3">
                            <label className="label">Actual</label>
                            <input type="number" min="0" className="input" value={newStockItem.currentStock}
                              onChange={(e)=>setNewStockItem(p=>({ ...p, currentStock: parseInt(e.target.value) || 0 }))} />
                          </div>
                          <div className="col12 colMd3" style={{ display:"flex", alignItems:"end" }}>
                            <button type="submit" className="btn btnPrimary" style={{ width:"100%", justifyContent:"center" }}>➕ Agregar ítem</button>
                          </div>
                        </form>
                      )}

                      {activeInv.mode !== "lot" && activeInv.mode !== "stock" && (
                        <form onSubmit={addCustomItem} className="grid grid12">
                          {(((activeInv.schema && activeInv.schema.fields) ? activeInv.schema : DEFAULT_CUSTOM_SCHEMA).fields || []).map((f) => {
                            const colClass = f.type === "text" ? "col12 colMd6" : "col12 colMd3";
                            if ((f.type || "").toLowerCase() === "select") {
                              return (
                                <div key={f.key} className={colClass}>
                                  <label className="label">{f.label || f.key}</label>
                                  <select className="input" value={newCustomItem[f.key] ?? ""} onChange={(e)=>setNewCustomItem(p=>({ ...p, [f.key]: e.target.value }))}>
                                    {(f.options || []).map(opt => <option key={opt} value={opt}>{opt}</option>)}
                                  </select>
                                </div>
                              );
                            }
                            return (
                              <div key={f.key} className={colClass}>
                                <label className="label">{f.label || f.key}</label>

                                  type={f.type === "number" ? "number" : "text"}

                                  onChange={(e)=>setNewCustomItem(p=>({ ...p, [f.key]: e.target.value }))}
                                />
                              </div>
                            );
                          })}
                          <div className="col12">
                            <button type="submit" className="btn btnPrimary" style={{ width:"100%", justifyContent:"center" }}>
                              ✅ Guardar ítem
                            </button>
                          </div>
                        </form>

                  </div>
                </div>

            </div>

          if (!activeInv) return null;
          return (

                    Tipo: <b>{activeInv.typeLabel || activeInv.mode}</b>{" "}
                    <span className="hintMuted">· mode: <span className="mono">{activeInv.mode}</span></span>
                  </p>
                </div>

                <div className="actions">
                  <button className="btn" onClick={exportActiveToCSV}>⬇️ Exportar CSV</button>
                  <button className="btn btnDanger" onClick={()=>deleteInventory(activeInv.id)}>🗑️ Borrar inventario</button>
                </div>
              </div>

              <div className="rowBetween">
                <div className="row" style={{ gap: 10 }}>
                  <span className="chip">Consejo</span>
                  <span className="hintMuted">

                  </span>
                </div>
                <button className={"btn " + (addOpen ? "" : "btnPrimary")} onClick={()=>setAddOpen(o=>!o)}>
                  {addOpen ? "➖ Cerrar agregar ítems" : "➕ Abrir agregar ítems"}
                </button>
              </div>

              <div style={{ marginTop: 14 }}>
                <AddItemsPanel />
              </div>
            </div>
          );
        }

        function invButton(inv){
          const active = inv.id === activeInvId;
          const count = (inv.items || []).length;
          const low = inv.mode === "stock" ? (inv.items || []).filter(x => (x.currentStock ?? 0) < (x.minStock ?? 0)).length : 0;
          return (
            <button className={"invBtn" + (active ? " active" : "")} onClick={() => setActiveInvId(inv.id)}>
              <div className="invLeft">
                <div className="invIcon" aria-hidden="true">{inv.icon || "📦"}</div>
                <div className="invText">
                  <div className="invName">{inv.title}</div>
                  <div className="invMeta">
                    <span className="chip chipSoft">{inv.typeLabel || inv.mode}</span>
                    {" "}· {count} ítems
                    {inv.mode === "stock" && low > 0 ? ` · ${low} alerta(s)` : ""}
                  </div>
                </div>
              </div>
              {inv.mode === "stock" && low > 0 ? <span className="chip chipBad">{low}</span> : <span className="chip">{count}</span>}
            </button>

                      <h1 className="h1">Control de Bodega</h1>
                      <p className="subtitle">

                      </p>
                    </div>
                  </div>

                    <button onClick={exportAllToCSV} className="btn btnPrimary">⬇️ Exportar TODO (CSV)</button>
                    <button onClick={handleResetDemo} className="btn">♻️ Reiniciar demo</button>
                  </div>
                </div>

                <div className="stats">
                  <div className="stat">
                    <div className="statLabel">Inventarios</div>
                    <div className="statValue">{inventories.length}</div>
                    <div className="statHint">Crea por JSON (Herramientas) o manual</div>
                  </div>
                  <div className="stat">
                    <div className="statLabel">Ítems totales</div>
                    <div className="statValue">{inventories.reduce((a,i)=>a+(i.items||[]).length,0)}</div>
                    <div className="statHint">Suma de todos los inventarios</div>
                  </div>
                  <div className="stat">
                    <div className="statLabel">Alertas</div>
                    <div className="statValue" style={{ color: lowStockAcross.length ? "var(--warning)" : "var(--success)" }}>
                      {lowStockAcross.length}
                    </div>
                    <div className="statHint">Bajo mínimo (solo mode: stock)</div>
                  </div>
                </div>
              </div>

              <div className="topTabs">
                {topTabBtn("inventories", "Inventarios", "📦")}
                {topTabBtn("tools", "Herramientas", "🧾")}
              </div>

              <div className="card main">
                {topTab === "inventories" && (
                  <div className="invLayout">
                    <div className="panel">
                      <h2 className="panelTitle">Inventarios</h2>
                      <p className="panelSub">
                        Elige un inventario para ver ítems. Para crear más inventarios o administrar categorías, ve a “Herramientas”.
                      </p>
                      <div className="invList">
                        {inventories.map(inv => <div key={inv.id}>{invButton(inv)}</div>)}
                      </div>
                    </div>

                    <div style={{ display:"flex", flexDirection:"column", gap: 14 }}>
                      {activeInv && (
                        <>
                          <InventoryHeader />

                          <div className="rowBetween">
                            <div className="grid" style={{ gridTemplateColumns: "1fr", gap: 10, width: "100%", maxWidth: 680 }}>
                              <input className="input" placeholder="Buscar ítems..." value={search} onChange={(e)=>setSearch(e.target.value)} />

                              {activeInv.mode === "lot" && (
                                <select className="input" value={filterCategory} onChange={(e)=>setFilterCategory(e.target.value)}>
                                  <option value="ALL">Todas las categorías</option>
                                  {Object.keys(activeInv.categories || DEFAULT_CATEGORIES).map(cat => (<option key={cat} value={cat}>{cat}</option>))}
                                </select>
                              )}
                            </div>

                            <div style={{ color:"#64748b", fontWeight: 900 }}>
                              {activeInv.mode === "lot" && <>Mostrando <span style={{ color:"#0f172a" }}>{lotFiltered.length}</span> de{" "}
                                <span style={{ color:"#0f172a" }}>{(activeInv.items || []).length}</span></>}
                              {activeInv.mode === "stock" && <>Mostrando <span style={{ color:"#0f172a" }}>{stockFiltered.length}</span> de{" "}
                                <span style={{ color:"#0f172a" }}>{(activeInv.items || []).length}</span></>}
                              {activeInv.mode !== "lot" && activeInv.mode !== "stock" && <>Mostrando <span style={{ color:"#0f172a" }}>{customFiltered.length}</span> de{" "}
                                <span style={{ color:"#0f172a" }}>{(activeInv.items || []).length}</span></>}
                            </div>
                          </div>

                          {activeInv.mode === "lot" && (
                            <div className="tableWrap">
                              <table>
                                <thead>
                                  <tr>
                                    <th>Ítem</th><th>Color</th><th>Largo</th><th>Corte</th>
                                    <th style={{ textAlign:"center" }}>Cant.</th><th>Ubicación</th><th style={{ textAlign:"right" }}>Acción</th>
                                  </tr>
                                </thead>
                                <tbody>
                                  {lotFiltered.length === 0 ? (
                                    <tr><td colSpan={7} style={{ padding: 18, textAlign:"center", color:"#94a3b8", fontStyle:"italic" }}>
                                      No hay coincidencias. Ajusta filtros o agrega ítems con el botón “Agregar ítems”.</td></tr>
                                  ) : (
                                    lotFiltered.map(item => (
                                      <tr key={item.id}>
                                        <td>
                                          <div style={{ fontWeight: 900 }}>{item.name}</div>
                                          <div style={{ fontSize: 12, color:"#64748b", fontWeight: 800, marginTop: 4 }}>{item.category}</div>
                                        </td>
                                        <td><span className="chip">{item.color}</span></td>
                                        <td className="mono">{formatFtIn(item.lengthFt, item.lengthIn)}</td>
                                        <td><span className={"chip " + (item.cut === "STK" ? "chipCutStk" : "chipCutOth")}>{item.cut}</span></td>
                                        <td style={{ textAlign:"center", fontWeight: 900 }}>{item.qty}</td>
                                        <td style={{ color:"#334155", fontWeight: 800 }}>{item.location}</td>
                                        <td style={{ textAlign:"right" }}><button className="btn btnSm" onClick={()=>deleteLotItem(item.id)}>🗑️ Eliminar</button></td>
                                      </tr>
                                    ))
                                  )}
                                </tbody>
                              </table>
                            </div>
                          )}

                          {activeInv.mode === "stock" && (
                            <>
                              <div className="rowBetween">
                                <div><span className="chip">Tip: bajo mínimo → aparece en “Pedido sugerido”.</span></div>
                              </div>

                              <div className="cards">
                                {stockFiltered.map(item => {
                                  const isLow = (item.currentStock ?? 0) < (item.minStock ?? 0);
                                  return (
                                    <div key={item.id} className={"itemCard" + (isLow ? " low" : "")}>
                                      <div className="rowBetween" style={{ alignItems:"flex-start" }}>
                                        <div>
                                          <div className="kicker">{item.category}</div>
                                          <div style={{ marginTop: 8, fontWeight: 900 }}>{item.name}</div>
                                        </div>
                                        {isLow ? <span className="chip chipWarn">PEDIR</span> : <span className="chip chipOk">OK</span>}
                                      </div>

                                      <div className="rowBetween" style={{ marginTop: 16 }}>
                                        <div style={{ color:"#475569", fontWeight: 900 }}>
                                          Mín: <span style={{ color:"#0f172a" }}>{item.minStock}</span> {item.unit}
                                        </div>

                                        <div className="actions" style={{ gap: 8 }}>
                                          <button className="btn btnSm" onClick={()=>bumpStock(activeInv.id, item.id, -1)} title="-1">−</button>

                                            type="number" min="0" value={item.currentStock}
                                            onChange={(e)=>updateStock(activeInv.id, item.id, e.target.value)} />
                                          <button className="btn btnSm" onClick={()=>bumpStock(activeInv.id, item.id, 1)} title="+1">+</button>
                                        </div>
                                      </div>

                                      <div className="rowBetween" style={{ marginTop: 12 }}>
                                        <span className="chip">{item.unit}</span>
                                        <button className="btn btnGhost btnSm" style={{ borderColor:"rgba(180,35,24,.25)", color:"var(--danger)" }} onClick={()=>deleteStockItem(item.id)}>
                                          🗑️ Eliminar
                                        </button>
                                      </div>
                                    </div>
                                  );
                                })}
                              </div>
                            </>
                          )}

                          {activeInv.mode !== "lot" && activeInv.mode !== "stock" && (
                            <div className="tableWrap">
                              <table>
                                <thead>
                                  <tr>
                                    {(((activeInv.schema && activeInv.schema.fields) ? activeInv.schema : DEFAULT_CUSTOM_SCHEMA).fields || []).map(f => (
                                      <th key={f.key}>{f.label || f.key}</th>
                                    ))}
                                    <th style={{ textAlign:"right" }}>Acción</th>
                                  </tr>
                                </thead>
                                <tbody>
                                  {customFiltered.length === 0 ? (
                                    <tr><td colSpan={(((activeInv.schema && activeInv.schema.fields) ? activeInv.schema : DEFAULT_CUSTOM_SCHEMA).fields || []).length + 1}
                                      style={{ padding: 18, textAlign:"center", color:"#94a3b8", fontStyle:"italic" }}>
                                      No hay coincidencias. Ajusta búsqueda o agrega ítems con “Agregar ítems”.</td></tr>
                                  ) : (
                                    customFiltered.map(row => (
                                      <tr key={row.id}>
                                        {(((activeInv.schema && activeInv.schema.fields) ? activeInv.schema : DEFAULT_CUSTOM_SCHEMA).fields || []).map(f => (
                                          <td key={f.key} style={{ fontWeight: f.key === "name" ? 900 : 650, color:"#334155" }}>
                                            {String(row[f.key] ?? "")}
                                          </td>
                                        ))}
                                        <td style={{ textAlign:"right" }}>
                                          <button className="btn btnSm" onClick={()=>deleteCustomItem(row.id)}>🗑️ Eliminar</button>
                                        </td>
                                      </tr>
                                    ))
                                  )}
                                </tbody>
                              </table>
                            </div>
                          )}
                        </>
                      )}
                    </div>
                  </div>

                {topTab === "tools" && (
                  <div className="fadeIn" style={{ display:"flex", flexDirection:"column", gap: 14 }}>
                    <div className="section">
                      <div className="sectionTop">

                          <p>Resumen por inventario: cantidad de ítems y alertas (solo en mode: stock).</p>
                        </div>
                        <div className="actions">
                          <button className="btn" onClick={exportActiveToCSV}>⬇️ Exportar inventario actual</button>
                          <button className="btn btnPrimary" onClick={exportAllToCSV}>⬇️ Exportar TODO</button>
                        </div>
                      </div>

                      <div className="tableWrap" style={{ marginTop: 14 }}>
                        <table>
                          <thead><tr><th>Inventario</th><th>Tipo</th><th>Ítems</th><th>Alertas</th><th style={{ textAlign:"right" }}>Acciones</th></tr></thead>
                          <tbody>
                            {balances.map(b => (
                              <tr key={b.id}>
                                <td>
                                  <div className="row" style={{ gap: 10 }}>
                                    <span className="chip">{b.icon}</span>
                                    <div style={{ fontWeight: 900 }}>{b.title}</div>
                                  </div>
                                </td>
                                <td><span className="chip chipSoft">{b.typeLabel || b.mode}</span></td>
                                <td style={{ fontWeight: 900 }}>{b.count}</td>
                                <td>{b.mode === "stock" ? (b.low > 0 ? <span className="chip chipBad">{b.low}</span> : <span className="chip chipOk">0</span>) : <span className="chip">—</span>}</td>
                                <td style={{ textAlign:"right" }}>
                                  <button className="btn btnSm" onClick={() => { setActiveInvId(b.id); setTopTab("inventories"); }}>Abrir</button>
                                  <button className="btn btnSm btnDanger" onClick={() => deleteInventory(b.id)} style={{ marginLeft: 8 }}>🗑️ Borrar</button>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>

                    <div className="section">
                      <div className="sectionTop">
                        <div>
                          <h3>Pedido sugerido (automático)</h3>
                          <p>Se genera con base en mínimos vs stock actual (de todos los inventarios mode: stock).</p>
                        </div>
                        <span className={"chip " + (lowStockAcross.length ? "chipWarn" : "chipOk")}>
                          {lowStockAcross.length ? `⚠️ ${lowStockAcross.length} ítems bajo mínimo` : "✅ Sin alertas"}
                        </span>
                      </div>

                      <div style={{ marginTop: 14 }}>
                        {lowStockAcross.length === 0 ? (
                          <div className="chip chipOk" style={{ padding:"12px 14px", borderRadius: 18, display:"block", textAlign:"center" }}>
                            ✅ No hay faltantes por mínimos.
                          </div>
                        ) : (
                          <div className="tableWrap" style={{ borderColor:"#fde68a" }}>
                            <table>
                              <thead><tr><th style={{ color:"#92400e" }}>Inventario</th><th style={{ color:"#92400e" }}>Artículo</th><th style={{ color:"#92400e" }}>Faltante</th><th style={{ color:"#92400e" }}>Estado</th></tr></thead>
                              <tbody>
                                {lowStockAcross.map((it, idx) => (
                                  <tr key={idx}>
                                    <td style={{ fontWeight: 900 }}>{it.inventoryTitle}</td>
                                    <td style={{ fontWeight: 800 }}>{it.name}</td>
                                    <td style={{ fontWeight: 900, color:"var(--danger)" }}>{(it.minStock ?? 0) - (it.currentStock ?? 0)} {it.unit}</td>
                                    <td><span className="chip chipBad">CRÍTICO</span></td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        )}
                      </div>
                    </div>

                    <div className="section">
                      <div className="sectionTop">
                        <div>
                          <h3>Administrar categorías (catálogo)</h3>
                          <p>
                            Para inventarios mode: <b>lot</b>: aquí puedes agregar y quitar categorías con confirmación (5s).
                          </p>
                        </div>
                        <span className="chip">Solo mode: lot</span>
                      </div>

                      <div className="grid grid12" style={{ marginTop: 12 }}>
                        <div className="col12 colMd5">
                          <label className="label">Inventario (lot)</label>
                          <select className="input" value={manageInvId} onChange={(e)=>setManageInvId(e.target.value)} disabled={lotInventories.length === 0}>
                            {lotInventories.length === 0 ? (
                              <option value="">No hay inventarios mode: lot</option>
                            ) : lotInventories.map(inv => (
                              <option key={inv.id} value={inv.id}>{inv.title}</option>
                            ))}
                          </select>

                          <div className="row" style={{ marginTop: 12 }}>
                            <label style={{ display:"flex", alignItems:"center", gap: 10, fontWeight: 800, color:"#475569" }}>
                              <input type="checkbox" checked={deleteAlsoItems} onChange={(e)=>setDeleteAlsoItems(e.target.checked)} />
                              Al quitar categoría, también borrar registros existentes en esa categoría
                            </label>
                          </div>

                          <hr className="hr" />

                          <div className="rowBetween" style={{ alignItems:"flex-end" }}>
                            <div style={{ flex: 1 }}>
                              <label className="label">Nueva categoría</label>
                              <input className="input" value={newCatName} onChange={(e)=>setNewCatName(e.target.value)} placeholder="Ej. Pavers, Maderas..." />
                            </div>
                            <button className="btn btnPrimary" onClick={addCategoryManual}>➕ Agregar</button>
                          </div>

                          <div style={{ marginTop: 12 }}>
                            <label className="label">Opciones (una por línea o separadas por coma)</label>
                            <textarea className="input" value={newCatItems} onChange={(e)=>setNewCatItems(e.target.value)} placeholder={"Ej:\nPaver 12x12\nPaver 16x16\n\n(o: Item 1, Item 2, Item 3)"} />
                            <div className="hintMuted" style={{ marginTop: 10, lineHeight: 1.6 }}>
                              Si dejas vacío, se crea la categoría igual (luego importas opciones por JSON).
                            </div>
                          </div>
                        </div>

                        <div className="col12 colMd7">
                          <label className="label">Categorías actuales</label>
                          <div className="pillList">
                            {manageInv && manageInv.mode === "lot" && Object.keys(manageInv.categories || {}).length > 0 ? (
                              Object.keys(manageInv.categories || {}).sort().map(cat => {
                                const optionCount = (manageInv.categories || {})[cat]?.length || 0;
                                const affected = (manageInv.items || []).filter(x => x.category === cat).length;
                                return (
                                  <div key={cat} className="pill">
                                    <div style={{ minWidth: 0 }}>
                                      <div className="pillName">{cat}</div>
                                      <div className="pillSmall">{optionCount} opción(es) · {affected} registro(s)</div>
                                    </div>
                                    <div style={{ marginLeft: "auto" }}>
                                      <button className="btn btnDanger btnSm" onClick={()=>deleteCategory(cat)}>🗑️ Quitar</button>
                                    </div>
                                  </div>
                                );
                              })
                            ) : (
                              <div className="chip" style={{ padding:"12px 14px", borderRadius: 18, display:"block" }}>
                                Este inventario todavía no tiene categorías personalizadas.
                              </div>
                            )}
                          </div>
                        </div>
                      </div>
                    </div>

                    <div className="section">
                      <div className="sectionTop">
                        <div>
                          <h3>Crear inventario (manual)</h3>
                          <p>
                            <b>mode</b> define el comportamiento. Puedes usar:
                            <br/>• <b>stock</b> (mínimos/alertas) · • <b>lot</b> (catálogo + medidas) · • <b>custom</b> (schema.fields).
                          </p>
                        </div>
                        <span className="chip">Versátil</span>
                      </div>

                      <div className="grid grid12" style={{ marginTop: 12 }}>
                        <div className="col12 colMd3">
                          <label className="label">id (único)</label>
                          <input className="input" value={createInv.id} onChange={(e)=>setCreateInv(p=>({...p, id:e.target.value}))} placeholder="ej: pavers, wood, papers" />
                        </div>
                        <div className="col12 colMd5">
                          <label className="label">título</label>
                          <input className="input" value={createInv.title} onChange={(e)=>setCreateInv(p=>({...p, title:e.target.value}))} placeholder="ej: Pavers / Maderas / Oficina..." />
                        </div>
                        <div className="col12 colMd2">
                          <label className="label">icono</label>
                          <input className="input" value={createInv.icon} onChange={(e)=>setCreateInv(p=>({...p, icon:e.target.value}))} placeholder="📦" />
                        </div>
                        <div className="col12 colMd2">
                          <label className="label">mode</label>
                          <select className="input" value={createInv.mode} onChange={(e)=>setCreateInv(p=>({...p, mode:e.target.value}))}>
                            <option value="stock">stock</option>
                            <option value="lot">lot</option>
                            <option value="custom">custom (schema)</option>
                          </select>
                        </div>

                        {createInv.mode === "custom" && (
                          <div className="col12 colMd6">
                            <label className="label">custom mode name (opcional)</label>
                            <input className="input" value={createInv.customMode} onChange={(e)=>setCreateInv(p=>({...p, customMode:e.target.value}))} placeholder="ej: tools, rentals, vehicles..." />
                          </div>
                        )}

                        <div className="col12 colMd6">
                          <label className="label">typeLabel (texto visible)</label>
                          <input className="input" value={createInv.typeLabel} onChange={(e)=>setCreateInv(p=>({...p, typeLabel:e.target.value}))} placeholder="ej: Stock, Sobrantes, Pavers, Equipo..." />
                        </div>

                        {createInv.mode === "custom" && (
                          <div className="col12">
                            <label className="label">schema (JSON) · define campos</label>
                            <textarea className="input" value={createInv.schemaText} onChange={(e)=>setCreateInv(p=>({...p, schemaText:e.target.value}))} />
                            <div className="hintMuted" style={{ marginTop: 10 }}>
                              Debe ser: {"{ fields: [ { key, label, type } ] }"} · tipos: text | number | select (con options).
                            </div>
                          </div>
                        )}

                        <div className="col12" style={{ display:"flex", alignItems:"end" }}>
                          <button className="btn btnPrimary" style={{ width:"100%", justifyContent:"center" }} onClick={createInventoryManual}>
                            ✅ Crear inventario
                          </button>
                        </div>
                      </div>
                    </div>

                    <div className="section">
                      <div className="sectionTop">
                        <div>
                          <h3>Importar inventarios (JSON)</h3>
                          <p>
                            Agrega o actualiza inventarios sin tocar código. Si el <b>id</b> ya existe, hace merge (agrega categorías/ítems).
                          </p>
                        </div>
                        <div className="actions">
                          <button
                            className="btn"
                            onClick={() => setImportInventoriesText(
                              JSON.stringify({
                                inventories: [
                                  {
                                    id: "papers",
                                    title: "Papers",
                                    icon: "📄",
                                    mode: "stock",
                                    typeLabel: "Oficina / Stock",
                                    items: [
                                      { category:"Oficina", name:"Papel carta", unit:"paquetes", minStock: 10, currentStock: 4 }
                                    ]
                                  },
                                  {
                                    id: "aluminum",
                                    title: "Aluminio (sobrantes)",
                                    icon: "🧱",
                                    mode: "lot",
                                    typeLabel: "Sobrantes",
                                    categories: { Pavers: ["Paver 12x12", "Paver 16x16"] }
                                  },
                                  {
                                    id: "rentals",
                                    title: "Rentas",
                                    icon: "🚚",
                                    mode: "custom",
                                    typeLabel: "Renta",
                                    schema: {
                                      fields: [
                                        { key:"name", label:"Equipo", type:"text" },
                                        { key:"vendor", label:"Proveedor", type:"text" },
                                        { key:"qty", label:"Cantidad", type:"number", default: 0 },
                                        { key:"status", label:"Estado", type:"select", options:["Disponible","En sitio","Devuelto"], default:"Disponible" }
                                      ]
                                    },
                                    items: [
                                      { name:"Placa compactadora", vendor:"XYZ Rentals", qty: 1, status:"En sitio" }
                                    ]
                                  }
                                ]
                              }, null, 2)
                            )}
                          >
                            🧩 Poner ejemplo
                          </button>
                          <button className="btn btnPrimary" onClick={importInventories}>⬆️ Importar inventarios</button>
                        </div>
                      </div>

                      <div className="grid grid12" style={{ marginTop: 12 }}>
                        <div className="col12 colMd8">
                          <label className="label">JSON</label>
                          <textarea className="input" value={importInventoriesText} onChange={(e)=>setImportInventoriesText(e.target.value)}
                            placeholder='{"inventories":[{"id":"papers","title":"Papers","icon":"📄","mode":"stock","typeLabel":"Stock"}]}' />
                        </div>
                        <div className="col12 colMd4">
                          <label className="label">Reglas rápidas</label>
                          <div className="chip" style={{ display:"block", padding:"12px 14px", borderRadius: 18 }}>
                            <div style={{ fontWeight: 900, marginBottom: 6 }}>Validador mental</div>
                            <div style={{ fontWeight: 650, color:"#475569", fontSize: 13, lineHeight: 1.7 }}>
                              • <b>id</b> único (sin espacios).<br/>
                              • <b>mode</b>: "stock", "lot", o cualquier texto (custom).<br/>
                              • <b>typeLabel</b>: texto libre.<br/>
                              • En "lot", puedes incluir <b>categories</b>.<br/>
                              • En custom, puedes incluir <b>schema</b>.<br/>
                              • Puedes incluir <b>items</b> iniciales.
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>

              {toast && (
                <div className={"toast fadeIn"} style={{
                  borderColor: toast.type === "ok" ? "rgba(21,128,61,.25)" : toast.type === "warn" ? "rgba(180,83,9,.25)" : "rgba(180,35,24,.25)",
                  background: toast.type === "ok" ? "#ecfdf5" : toast.type === "warn" ? "#fffbeb" : "#fef2f2"
                }}>
                  {toast.message}
                </div>
              )}

              <ConfirmModal
                open={confirmState.open}
                title={confirmState.title}
                body={confirmState.body}
                dangerLabel={confirmState.dangerLabel}
                onCancel={closeConfirm}
                onConfirm={() => { confirmState.onConfirm && confirmState.onConfirm(); }}
                seconds={5}
              />
            </div>
          </>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
